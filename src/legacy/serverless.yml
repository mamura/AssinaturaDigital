service: digitalSignature
configValidationMode: off
# We need integration with Parameter Store (a.k.a SSM, for Simple Systems Manager).
# It was just included on Serverless Framework from version 1.22. So, it is the minimum
# version required to make it work.
#frameworkVersion: "*"

package:
  exclude:
    - public/**
    - .vscode/**
    - .serverless/**

plugins:
  - serverless-iam-roles-per-function
  - serverless-offline
  - serverless-apigw-binary
  #- serverless-localstack
  #- serverless-plugin-warmup
  #- serverless-vpc-discovery

custom:
  serverless-iam-roles-per-function:
    defaultInherit: true
  apigwBinary:
    types:
      - "application/xml"
      - "application/x-pkcs7-signature"
      - "application/x-pkcs7-mime"
      - "application/octet-stream"
  warmup:
    default: true # Whether to warm up all functions by default or not
    folderName: "_warmup" # Name of the folder created for the generated warmup 
    cleanFolder: true
    events:
      - schedule: cron(0/5 10-23 ? * SUN-SAT *) # Run WarmUP every 5 minutes Sun-Sat between 10:00am and 11:55pm (UTC). In Brazilian time: 7h ~ 20h55
      - schedule: cron(0/5 0-1 ? * SUN-SAT *) # Run WarmUP every 5 minutes Sun-Sat between 0:00am and 01:55am (UTC). In Brazilian time: 21h ~ 22h55
    package:  
      individually: true
      exclude: # exclude additional binaries that are included at the serverless package level 
        - ../**
        - ../../**
      include:
        - ./**
    prewarm: false # Run WarmUp immediately after a lambda deployment
    concurrency: 1

  #localstack:
  #  debug: true
  #  stages:
  #    - local
  #  host: localstack
  #  edgePort: 4566
  #  autostart: false
  #  lambda:
  #    mountCode: false
  #  services:
  #    - dynamodb
  #    - sqs
  #    - s3
  #    - sns
  #    - ssm

  #vpc:
  #  vpcName: ${file(config.yml):NETWORK_VPC_NAME}
  #  subnetNames: ${file(config.yml):NETWORK_SUBNET_NAMES}
  #  securityGroupNames: ${file(config.yml):NETWORK_SECURITY_GROUP_NAMES}

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, file(config.yml):STAGE}
  region: ${file(config.yml):CLOUD_REGION}
  apiGateway:
    apiKeySourceType: HEADER
  timeout: ${file(config.yml):EXECUTION_TIMEOUT}
  cfLogs: true
  logRetentionInDays: ${file(config.yml):LOG_RETENTION_IN_DAYS}
  versionFunctions: ${file(config.yml):VERSION_FUNCTIONS}
  apiKeys: ${file(config.yml):API_KEYS}
  environment: ${file(config.yml):ENVIRONMENT}
  iamRoleStatements:
    # Grant global service permissions to access VPC resources
    - Effect: Allow
      Action:
        - ec2:CreateNetworkInterface
        - ec2:DescribeNetworkInterfaces
        - ec2:DeleteNetworkInterface
      Resource: "*"
    # Grant global service permissions to handle cache table in DynamoDB
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
      Resource:
        - Fn::GetAtt: [ServiceCacheTable, Arn]
    # Grant global service permission to handle parameter store in AWS Systems Manager (SSM)
    - Effect: "Allow"
      Action:
      - "ssm:GetParameters"
      - "ssm:GetParameter"
      - "ssm:DescribeParameters"
      Resource: 
        Fn::Join:
          - ":"
          - - "arn:aws:ssm:${self:provider.region}"
            - Ref: "AWS::AccountId"
            - "parameter/${self:provider.stage}-*"
      Condition:
        StringLike:
          "ssm:resourceTag/service":
            - ${self:service.name, self:service}
    # Grant global service permission to use AWS Key Management Service (KMS) in order to decrypt at rest
    # secured parameters persisted in parameter store.
    - Effect: "Allow"
      Action:
      - "kms:Decrypt"
      Resource: 
        Fn::Join:
          - ":"
          - - "arn:aws:kms:${self:provider.region}"
            - Ref: "AWS::AccountId"
            - "key/*"
    # Grant global service permission to access API Keys infos from API Gateway
    - Effect: "Allow"
      Action:
      - "apigateway:GET"
      Resource: 
        Fn::Join:
          - ":"
          - - "arn:aws:apigateway:${self:provider.region}"
            - ""
            - "/apikeys/*"
    # Grant global service permission to self lambda invocations (necessary for warmup plugin working correctly)
    - Effect: "Allow"
      Action:
        - "lambda:InvokeFunction"
      Resource:
        Fn::Join:
          - ':'
          - - "arn:aws:lambda:${self:provider.region}"
            - Ref: "AWS::AccountId"
            - "function:${self:service.name, self:service}-${self:provider.stage}-*"

functions:
  authorizeSignerKey:
    handler: handlers/authorizeSignerKey.handler
    memorySize: 128
    timeout: 30
    description: Requests signer's authorization to use his/her private key for signing documents.
    events:
      - http: 
          path: signer/authorize
          method: post
          integration: lambda-proxy
          private: true
          cors:
            origin: ${file(config.yml):CORS_ORIGINS}
            headers: ${file(config.yml):CORS_HEADERS}
            allowCredentials: false
    iamRoleStatementsInherit: true
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
        Resource:
          - Fn::GetAtt: [SignersAuthorizationTable, Arn]
  receiveUnsignedDoc:
    handler: handlers/receiveUnsignedDocument.handler
    memorySize: 512
    timeout: 15
    description: Receives the documents to be signed and initiates a transaction to process signatures.
    events:
      - http: 
          path: signature/sign
          method: post
          integration: lambda-proxy
          private: true
          cors:
            origin: ${file(config.yml):CORS_ORIGINS}
            headers: ${file(config.yml):CORS_HEADERS}
            allowCredentials: false
    iamRoleStatementsInherit: true
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
        Resource:
          - Fn::GetAtt: [SignaturesTable, Arn]
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource:
          - Fn::GetAtt: [SignaturesTable, Arn]
          - Fn::Join:
            - '/'
            - - Fn::GetAtt: [SignaturesTable, Arn]
              - "index"
              - "signatureShortIdIndex"
      - Effect: Allow
        Action:
          - sqs:SendMessage
          - sqs:GetQueueUrl
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [PendingSignaturesQueue, Arn]
  processSignature:
    handler: handlers/processSignature.handler
    memorySize: 512
    timeout: 60
    description: Sends the documents to be signed to the certifier to process the signature
    reservedConcurrency: 30
    events:
      - sqs:
          arn: 
            Fn::GetAtt: [PendingSignaturesQueue, Arn]
          batchSize: ${file(config.yml):ENVIRONMENT.LAMBDA_PROCESS_SIGNATURE_READ_SQS_BATCH_SIZE}
    iamRoleStatementsInherit: true      
    iamRoleStatements:
      - Effect: Allow
        Action:
          - sqs:ReceiveMessage
          - sqs:DeleteMessage
          - sqs:GetQueueUrl
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [PendingSignaturesQueue, Arn]
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:GetItem
          - dynamodb:UpdateItem
        Resource:
          - Fn::GetAtt: [SignaturesTable, Arn]
  registerReadySign:
    handler: handlers/registerReadySignature.handler
    memorySize: 512
    timeout: 20
    description: Receives the callback from the provider signalizing that a document signature has been completed 
    events:
      - http: 
          path: signature/ready/{requestId}
          method: post
          integration: lambda-proxy
          request:
            parameters:
              querystrings:
                providerSignatureId: true
              paths:
                requestId: true
          private: false
          cors:
            origin: ${file(config.yml):CORS_ORIGINS}
            headers: ${file(config.yml):CORS_HEADERS}
            allowCredentials: false
      - http: 
          path: signature/persist/{requestId} #for legacy reasons
          method: post
          integration: lambda-proxy
          request:
            parameters:
              querystrings:
                providerSignatureId: true
              paths:
                requestId: true
          private: false
          cors:
            origin: ${file(config.yml):CORS_ORIGINS}
            headers: ${file(config.yml):CORS_HEADERS}
            allowCredentials: false
    iamRoleStatementsInherit: true
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:UpdateItem
        Resource:
          - Fn::GetAtt: [SignaturesTable, Arn]
      - Effect: Allow
        Action:
          - sqs:SendMessage
          - sqs:GetQueueUrl
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [RegisteredReadySignaturesQueue, Arn]
  saveSignedDoc:
    handler: handlers/saveSignedDocument.handler
    memorySize: 512
    timeout: 60
    description: Asynchronously persists all ready signed documents into DB 
    events:
      - sqs:
          arn: 
            Fn::GetAtt: [RegisteredReadySignaturesQueue, Arn]
          batchSize: ${file(config.yml):ENVIRONMENT.LAMBDA_SAVE_SIGNED_DOCUMENT_READ_SQS_BATCH_SIZE}
    iamRoleStatementsInherit: true
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:UpdateItem
        Resource:
          - Fn::GetAtt: [SignaturesTable, Arn]
      - Effect: Allow
        Action:
          - sqs:ReceiveMessage
          - sqs:DeleteMessage
          - sqs:GetQueueUrl
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [RegisteredReadySignaturesQueue, Arn]
      - Effect: Allow
        Action:
          - sqs:SendMessage
          - sqs:GetQueueUrl
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [ReadyOrErroredSignaturesQueue, Arn]
  notifyRequester:
    handler: handlers/notifyRequester.handler
    memorySize: 512
    timeout: 60
    description: Notifies requester that signature has been completed and send to it the corresponding signed files
    reservedConcurrency: 30
    events:
      - sqs:
          arn: 
            Fn::GetAtt: [ReadyOrErroredSignaturesQueue, Arn]
          batchSize: ${file(config.yml):ENVIRONMENT.LAMBDA_NOTIFY_REQUESTER_READ_SQS_BATCH_SIZE}
    iamRoleStatementsInherit: true
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:GetItem
          - dynamodb:UpdateItem
        Resource:
          - Fn::GetAtt: [SignaturesTable, Arn]
      - Effect: Allow
        Action:
          - sqs:ReceiveMessage
          - sqs:DeleteMessage
          - sqs:GetQueueUrl
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [ReadyOrErroredSignaturesQueue, Arn]
      - Effect: Allow
        Action:
          - sqs:SendMessage
          - sqs:GetQueueUrl
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [AdminErrorNotificationQueue, Arn]
  notifyAdminOnError:
    handler: handlers/notifyAdminOnError.handler
    memorySize: 512
    timeout: 60
    description: Notifies service administrators whenever an error occurrs
    reservedConcurrency: 30
    events:
      - sqs:
          arn: 
            Fn::GetAtt: [AdminErrorNotificationQueue, Arn]
          batchSize: ${file(config.yml):ENVIRONMENT.LAMBDA_NOTIFY_ADMIN_ON_ERROR_READ_SQS_BATCH_SIZE}
    iamRoleStatementsInherit: true
    iamRoleStatements:
      - Effect: Allow
        Action:
          - sqs:ReceiveMessage
          - sqs:DeleteMessage
          - sqs:GetQueueUrl
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [AdminErrorNotificationQueue, Arn]
      - Effect: Allow
        Action:
          - SNS:Publish
        Resource:
          - ${file(config.yml):ENVIRONMENT.RSRC_ADMIN_EMAIL_LIST_GROUP_SNS_TOPIC_ARN}
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:GetItem
          - dynamodb:UpdateItem
        Resource:
          - Fn::GetAtt: [SignaturesTable, Arn]
  serveSignedDoc:
    handler: handlers/serveSignedDocument.handler
    memorySize: 512
    timeout: 15
    description: Endpoint to download an already signed file 
    events:
      - http: 
          path: signature/download/{requestId}
          method: get
          integration: lambda-proxy
          request:
            parameters:
              paths:
                requestId: true
          private: true
          cors:
            origin: ${file(config.yml):CORS_ORIGINS}
            headers: ${file(config.yml):CORS_HEADERS}
            allowCredentials: false
          cacheControl: "no-cache, no-store, must-revalidate"
    iamRoleStatementsInherit: true
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource:
          - Fn::GetAtt: [SignaturesTable, Arn]
  serveUnsignedDoc:
    handler: handlers/serveUnsignedDocument.handler
    memorySize: 512
    timeout: 15
    description: Endpoint to download the unsigned copy of a file 
    events:
      - http: 
          path: signature/download/{requestId}/unsigned
          method: get
          integration: lambda-proxy
          request:
            parameters:
              paths:
                requestId: true
          private: true
          cors:
            origin: ${file(config.yml):CORS_ORIGINS}
            headers: ${file(config.yml):CORS_HEADERS}
            allowCredentials: false
          cacheControl: "no-cache, no-store, must-revalidate"
    iamRoleStatementsInherit: true
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource:
          - Fn::GetAtt: [SignaturesTable, Arn]
  checkSignStatus:
    handler: handlers/checkSignatureStatus.handler
    memorySize: 512
    timeout: 15
    description: Endpoint to check the status of a document sent to be signed 
    events:
     - http: 
          path: signature/status/{requestIdOrShortId}
          method: get
          integration: lambda-proxy
          request:
            parameters:
              paths:
                requestIdOrShortId: true
          private: false
          cors:
            origin: ${file(config.yml):CORS_ORIGINS}
            headers: ${file(config.yml):CORS_HEADERS}
            allowCredentials: false
    iamRoleStatementsInherit: true
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:UpdateItem
        Resource:
          - Fn::GetAtt: [SignaturesTable, Arn] 
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource:
          - Fn::GetAtt: [SignaturesTable, Arn]
          - Fn::Join:
            - '/'
            - - Fn::GetAtt: [SignaturesTable, Arn]
              - "index"
              - "signatureShortIdIndex"
      - Effect: Allow
        Action:
          - dynamodb:Query
          - dynamodb:GetItem
          - dynamodb:PutItem
        Resource:
          - Fn::GetAtt: [SignaturesCheckTable, Arn]
  cronRetry:
    handler: handlers/cronRetry.handler
    memorySize: 1024
    timeout: 150
    description: "Actively retries reprocessing troubled signature requests (ex: in cases that the provider did not send the callback signalizing the signature conclusion, or when signature transaction has failed, or notification to requester has failed)"
    reservedConcurrency: 1
    warmup:
      enabled: false
    events:
      - schedule:
          name: ${file(config.yml):STAGE}-${self:service.name, self:service}-cron-retry-10am_to_1159am_utc
          description: "Run every 1 minute Sun-Sat between 10:00am and 11:59pm (UTC). In Brazilian time: 7h ~ 20h59"
          rate: "cron(0/1 10-23 ? * SUN-SAT *)" # Run every 1 minute Sun-Sat between 10:00am and 11:59pm (UTC). In Brazilian time: 7h ~ 20h59
          enabled: true
      - schedule:
          name: ${file(config.yml):STAGE}-${self:service.name, self:service}-cron-retry-0am_to_0159am_utc
          description: "Run every 1 minute Sun-Sat between 0:00am and 01:59am (UTC). In Brazilian time: 21h ~ 22h59"
          rate: "cron(0/1 0-1 ? * SUN-SAT *)" # Run every 1 minute Sun-Sat between 0:00am and 01:59am (UTC). In Brazilian time: 21h ~ 22h59
          enabled: true
    iamRoleStatementsInherit: true
    iamRoleStatements:
      - Effect: Allow
        Action:
          - dynamodb:Query
        Resource:
          - Fn::Join:
            - '/'
            - - Fn::GetAtt: [SignaturesTable, Arn]
              - "index"
              - "signatureStsAndStsUpdatedAtIndex"
          - Fn::Join:
            - '/'
            - - Fn::GetAtt: [SignaturesTable, Arn]
              - "index"
              - "requesterCallbackStsUpdatedAtIndex"
      - Effect: Allow
        Action:
          - dynamodb:UpdateItem
        Resource:
          - Fn::GetAtt: [SignaturesTable, Arn]
      - Effect: Allow
        Action:
          - sqs:SendMessage
          - sqs:GetQueueUrl
          - sqs:GetQueueAttributes
        Resource:
          - Fn::GetAtt: [PendingSignaturesQueue, Arn]
          - Fn::GetAtt: [RegisteredReadySignaturesQueue, Arn]
          - Fn::GetAtt: [ReadyOrErroredSignaturesQueue, Arn]

resources:
  Resources:
    SignaturesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${file(config.yml):DYNAMO_TABLES_DELETION_POLICE}
      Properties:
        TableName: ${file(config.yml):ENVIRONMENT.RSRC_SIGNATURES_TABLE}
        AttributeDefinitions:
          - AttributeName: requestId
            AttributeType: S
          - AttributeName: shortId
            AttributeType: S
          - AttributeName: signerIdentity
            AttributeType: S
          - AttributeName: sts
            AttributeType: S
          - AttributeName: requesterCallbackSts
            AttributeType: S
          - AttributeName: stsUpdatedAt
            AttributeType: N
        KeySchema:
          - AttributeName: requestId
            KeyType: HASH
          - AttributeName: signerIdentity
            KeyType: RANGE
        # Billing mode directive was commented because it is failing during deploy. That's because one can change a table from provisioned capacity to on-demand once per day.
        #BillingMode: PAY_PER_REQUEST
        ProvisionedThroughput:
          ReadCapacityUnits: ${file(config.yml):DYNAMO_TABLES_READ_HEAVY_THROUGHPUT}
          WriteCapacityUnits: ${file(config.yml):DYNAMO_TABLES_WRITE_HEAVY_THROUGHPUT}
        GlobalSecondaryIndexes:
          - IndexName: signatureShortIdIndex
            KeySchema:
              - AttributeName: shortId
                KeyType: HASH
            Projection:
              NonKeyAttributes:
                - sts
              ProjectionType: INCLUDE
            ProvisionedThroughput:
              ReadCapacityUnits: ${file(config.yml):DYNAMO_TABLE_IDEXES_READ_HEAVY_THROUGHPUT}
              WriteCapacityUnits: ${file(config.yml):DYNAMO_TABLE_IDEXES_WRITE_HEAVY_THROUGHPUT}
          - IndexName: signatureStsAndStsUpdatedAtIndex
            KeySchema:
              - AttributeName: sts
                KeyType: HASH
              - AttributeName: stsUpdatedAt
                KeyType: RANGE
            Projection:
              NonKeyAttributes:
                - signerIdentity
                - provider
                - signerAuthorizationExp
                - unsignedDocument
                - requestOrigin
                - providerSignatureId
                - requesterCallbackSts
                - createdAt
                - requesterCallbackStsUpdatedAt
              ProjectionType: INCLUDE
            ProvisionedThroughput:
              ReadCapacityUnits: ${file(config.yml):DYNAMO_TABLE_IDEXES_READ_HEAVY_THROUGHPUT}
              WriteCapacityUnits: ${file(config.yml):DYNAMO_TABLE_IDEXES_WRITE_HEAVY_THROUGHPUT}
          - IndexName: requesterCallbackStsUpdatedAtIndex
            KeySchema:
              - AttributeName: requesterCallbackSts
                KeyType: HASH
              - AttributeName: stsUpdatedAt
                KeyType: RANGE
            Projection:
              NonKeyAttributes:
                - signerIdentity
                - provider
                - signerAuthorizationExp
                - unsignedDocument
                - requestOrigin
                - providerSignatureId
                - sts
                - createdAt
                - requesterCallbackStsUpdatedAt
              ProjectionType: INCLUDE
            ProvisionedThroughput:
              ReadCapacityUnits: ${file(config.yml):DYNAMO_TABLE_IDEXES_READ_HEAVY_THROUGHPUT}
              WriteCapacityUnits: ${file(config.yml):DYNAMO_TABLE_IDEXES_WRITE_HEAVY_THROUGHPUT}
    SignaturesCheckTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${file(config.yml):DYNAMO_TABLES_DELETION_POLICE}
      Properties:
        TableName: ${file(config.yml):ENVIRONMENT.RSRC_SIGNATURES_CHECK_TABLE}
        AttributeDefinitions:
          - AttributeName: requestId
            AttributeType: S
        KeySchema:
          - AttributeName: requestId
            KeyType: HASH
        # Billing mode directive was commented because it is failing during deploy. That's because one can change a table from provisioned capacity to on-demand once per day.
        #BillingMode: PAY_PER_REQUEST
        ProvisionedThroughput:
          ReadCapacityUnits: ${file(config.yml):DYNAMO_TABLES_READ_THROUGHPUT}
          WriteCapacityUnits: ${file(config.yml):DYNAMO_TABLES_WRITE_THROUGHPUT}
    #TrustedChainCertificatesTable:
    #  Type: AWS::DynamoDB::Table
    #  DeletionPolicy: ${file(config.yml):DYNAMO_TABLES_DELETION_POLICE}
    #  Properties:
    #    TableName: ${file(config.yml):ENVIRONMENT.RSRC_TRUSTED_CHAIN_CERTIFICATES_TABLE}
    #    AttributeDefinitions:
    #      - AttributeName: subjectDN
    #        AttributeType: S
    #    KeySchema:
    #      - AttributeName: subjectDN
    #        KeyType: HASH
    #    # Billing mode directive was commented because it is failing during deploy. That's because one can change a table from provisioned capacity to on-demand once per day.
    #    #BillingMode: PAY_PER_REQUEST
    #    ProvisionedThroughput:
    #      ReadCapacityUnits: ${file(config.yml):DYNAMO_TABLES_READ_THROUGHPUT}
    #      WriteCapacityUnits: ${file(config.yml):DYNAMO_TABLES_WRITE_THROUGHPUT}
    #SignersCertificatesTable:
    #  Type: AWS::DynamoDB::Table
    #  DeletionPolicy: ${file(config.yml):DYNAMO_TABLES_DELETION_POLICE}
    #  Properties:
    #    TableName: ${file(config.yml):ENVIRONMENT.RSRC_SIGNERS_CERTIFICATES_TABLE}
    #    AttributeDefinitions:
    #      - AttributeName: signerIdentity
    #        AttributeType: S
    #    KeySchema:
    #      - AttributeName: signerIdentity
    #        KeyType: HASH
    #    # Billing mode directive was commented because it is failing during deploy. That's because one can change a table from provisioned capacity to on-demand once per day.
    #    #BillingMode: PAY_PER_REQUEST
    #    ProvisionedThroughput:
    #      ReadCapacityUnits: ${file(config.yml):DYNAMO_TABLES_READ_THROUGHPUT}
    #      WriteCapacityUnits: ${file(config.yml):DYNAMO_TABLES_WRITE_THROUGHPUT}
    SignersAuthorizationTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${file(config.yml):DYNAMO_TABLES_DELETION_POLICE}
      Properties:
        TableName: ${file(config.yml):ENVIRONMENT.RSRC_SIGNERS_AUTHORIZATION_TABLE}
        AttributeDefinitions:
          - AttributeName: requestId
            AttributeType: S
          - AttributeName: signerIdentity
            AttributeType: S
        KeySchema:
          - AttributeName: requestId
            KeyType: HASH
          - AttributeName: signerIdentity
            KeyType: RANGE
        # Billing mode directive was commented because it is failing during deploy. That's because one can change a table from provisioned capacity to on-demand once per day.
        #BillingMode: PAY_PER_REQUEST
        ProvisionedThroughput:
          ReadCapacityUnits: ${file(config.yml):DYNAMO_TABLES_READ_THROUGHPUT}
          WriteCapacityUnits: ${file(config.yml):DYNAMO_TABLES_WRITE_THROUGHPUT}
    ServiceCacheTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${file(config.yml):DYNAMO_TABLES_DELETION_POLICE}
      Properties:
        TableName: ${file(config.yml):ENVIRONMENT.RSRC_SERVICE_CACHE_TABLE}
        AttributeDefinitions:
          - AttributeName: entryKey
            AttributeType: S
        KeySchema:
          - AttributeName: entryKey
            KeyType: HASH
        # Billing mode directive was commented because it is failing during deploy. That's because one can change a table from provisioned capacity to on-demand once per day.    
        #BillingMode: PAY_PER_REQUEST
        ProvisionedThroughput:
          ReadCapacityUnits: ${file(config.yml):DYNAMO_TABLES_READ_THROUGHPUT}
          WriteCapacityUnits: ${file(config.yml):DYNAMO_TABLES_WRITE_THROUGHPUT}
    PendingSignaturesQueue:
      Type: "AWS::SQS::Queue"
      DeletionPolicy: ${file(config.yml):SQS_DELETION_POLICE}
      Properties:
        QueueName: ${file(config.yml):ENVIRONMENT.RSRC_PENDING_SIGNATURES_QUEUE}
        VisibilityTimeout: ${file(config.yml):SQS_MESSAGES_VISIBILITY_TIMEOUT}
        MessageRetentionPeriod: ${file(config.yml):SQS_RETENTION_PERIOD_SECONDS}
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [PendingSignaturesDeadLetterQueue, Arn]
          maxReceiveCount: ${file(config.yml):SQS_REDRIVE_POLICY_MAX_RECEIVE_COUNT}
    PendingSignaturesDeadLetterQueue:
      Type: "AWS::SQS::Queue"
      DeletionPolicy: ${file(config.yml):SQS_DELETION_POLICE}
      Properties:
        QueueName: ${file(config.yml):ENVIRONMENT.RSRC_PENDING_SIGNATURES_DL_QUEUE}
        MessageRetentionPeriod: ${file(config.yml):SQS_DL_RETENTION_PERIOD_SECONDS}
    RegisteredReadySignaturesQueue:
      Type: "AWS::SQS::Queue"
      DeletionPolicy: ${file(config.yml):SQS_DELETION_POLICE}
      Properties:
        QueueName: ${file(config.yml):ENVIRONMENT.RSRC_REGISTERED_READY_SIGNATURES_QUEUE}
        VisibilityTimeout: ${file(config.yml):SQS_MESSAGES_VISIBILITY_TIMEOUT}
        MessageRetentionPeriod: ${file(config.yml):SQS_RETENTION_PERIOD_SECONDS}
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [RegisteredReadySignaturesDeadLetterQueue, Arn]
          maxReceiveCount: ${file(config.yml):SQS_REDRIVE_POLICY_MAX_RECEIVE_COUNT}
    RegisteredReadySignaturesDeadLetterQueue:
      Type: "AWS::SQS::Queue"
      DeletionPolicy: ${file(config.yml):SQS_DELETION_POLICE}
      Properties:
        QueueName: ${file(config.yml):ENVIRONMENT.RSRC_REGISTERED_READY_SIGNATURES_DL_QUEUE}
        MessageRetentionPeriod: ${file(config.yml):SQS_DL_RETENTION_PERIOD_SECONDS}
    ReadyOrErroredSignaturesQueue:
      Type: "AWS::SQS::Queue"
      DeletionPolicy: ${file(config.yml):SQS_DELETION_POLICE}
      Properties:
        QueueName: ${file(config.yml):ENVIRONMENT.RSRC_READY_OR_ERRORED_SIGNATURES_QUEUE}
        VisibilityTimeout: ${file(config.yml):SQS_MESSAGES_VISIBILITY_TIMEOUT}
        MessageRetentionPeriod: ${file(config.yml):SQS_RETENTION_PERIOD_SECONDS}
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [ReadyOrErroredSignaturesDeadLetterQueue, Arn]
          maxReceiveCount: ${file(config.yml):SQS_REDRIVE_POLICY_MAX_RECEIVE_COUNT}
    ReadyOrErroredSignaturesDeadLetterQueue:
      Type: "AWS::SQS::Queue"
      DeletionPolicy: ${file(config.yml):SQS_DELETION_POLICE}
      Properties:
        QueueName: ${file(config.yml):ENVIRONMENT.RSRC_READY_OR_ERRORED_SIGNATURES_DL_QUEUE}
        MessageRetentionPeriod: ${file(config.yml):SQS_DL_RETENTION_PERIOD_SECONDS}
    AdminErrorNotificationQueue:
      Type: "AWS::SQS::Queue"
      DeletionPolicy: ${file(config.yml):SQS_DELETION_POLICE}
      Properties:
        QueueName: ${file(config.yml):ENVIRONMENT.RSRC_ADMIN_ERROR_NOTIFICATION_QUEUE}
        #DelaySeconds: ${file(config.yml):SQS_DELAY_SECONDS_ADMIN_ERROR_NOTIFICATION}
        VisibilityTimeout: ${file(config.yml):SQS_MESSAGES_VISIBILITY_TIMEOUT}
        MessageRetentionPeriod: ${file(config.yml):SQS_RETENTION_PERIOD_SECONDS}
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [AdminErrorNotificationDeadLetterQueue, Arn]
          maxReceiveCount: ${file(config.yml):SQS_REDRIVE_POLICY_MAX_RECEIVE_COUNT_ADMIN_ERROR_NOTIFICATION}
    AdminErrorNotificationDeadLetterQueue:
      Type: "AWS::SQS::Queue"
      DeletionPolicy: ${file(config.yml):SQS_DELETION_POLICE}
      Properties:
        QueueName: ${file(config.yml):ENVIRONMENT.RSRC_ADMIN_ERROR_NOTIFICATION_DL_QUEUE}
        MessageRetentionPeriod: ${file(config.yml):SQS_DL_RETENTION_PERIOD_SECONDS}
    ## S3 Bucket for storing web pages
    SignatureStatusWebAppS3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${file(config.yml):ENVIRONMENT.RSRC_SIGNATURE_STATUS_WEBAPP_S3_BUCKET}
        AccessControl: PublicRead
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
    ## Policies to make sure all files inside the Bucket are avaialble to CloudFront
    SignatureStatusWebAppS3BucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: SignatureStatusWebAppS3Bucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: "*"
              Action:
              - s3:GetObject
              Resource: arn:aws:s3:::${file(config.yml):ENVIRONMENT.RSRC_SIGNATURE_STATUS_WEBAPP_S3_BUCKET}/*
     ## Specifying the CloudFront Distribution to server your Web Application
    SignatureStatusWebAppCloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Origins:
            - DomainName: ${file(config.yml):ENVIRONMENT.RSRC_SIGNATURE_STATUS_WEBAPP_S3_BUCKET}.s3.amazonaws.com
              ## An identifier for the origin which must be unique within the distribution
              Id: SignatureStatusWebApp
              CustomOriginConfig:
                HTTPPort: 80
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
                ## In case you want to restrict the bucket access use S3OriginConfig and remove CustomOriginConfig
                # S3OriginConfig:
                #   OriginAccessIdentity: origin-access-identity/cloudfront/E127EXAMPLE51Z
          Enabled: "true"
          ## Uncomment the following section in case you are using a custom domain
          # Aliases:
          # - mysite.example.com
          DefaultRootObject: index.html
          ## Since the Single Page App is taking care of the routing we need to make sure ever path is served with index.html
          ## The only exception are files that actually exist e.g. *.js, *.css
          CustomErrorResponses:
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
          DefaultCacheBehavior:
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            ## The origin id defined above
            TargetOriginId: SignatureStatusWebApp
            ## Defining if and how the QueryString and Cookies are forwarded to the origin which in this case is S3
            ForwardedValues:
              QueryString: "false"
              Cookies:
                Forward: none
            ## The protocol that users can use to access the files in the origin. To allow HTTP use `allow-all`
            ViewerProtocolPolicy: redirect-to-https
          ## The certificate to use when viewers use HTTPS to request objects.
          ViewerCertificate:
            CloudFrontDefaultCertificate: "true"

    # In order to set up log group retention policies, it is necessary extends default
    # cloud formation generated by Serverless Framework with the DeletionPolicy property
    # one wants to assign to log groups. It must be done for all log groups generated
    # for each function individually. It is strongly recommended to set with value Retain
    # in production environment so as to keep trackability of Lambda execution even if 
    # CloudFormation stack is deleted. 
    AuthorizeSignerKeyLogGroup:
      Type: AWS::Logs::LogGroup
      DeletionPolicy: ${file(config.yml):LOG_GROUP_DELETION_POLICE}
    ReceiveUnsignedDocLogGroup:
      Type: AWS::Logs::LogGroup
      DeletionPolicy: ${file(config.yml):LOG_GROUP_DELETION_POLICE}
    ProcessSignatureLogGroup:
      Type: AWS::Logs::LogGroup
      DeletionPolicy: ${file(config.yml):LOG_GROUP_DELETION_POLICE}
    SaveSignedDocLogGroup:
      Type: AWS::Logs::LogGroup
      DeletionPolicy: ${file(config.yml):LOG_GROUP_DELETION_POLICE}
    NotifyRequesterLogGroup:
      Type: AWS::Logs::LogGroup
      DeletionPolicy: ${file(config.yml):LOG_GROUP_DELETION_POLICE}
    NotifyAdminOnErrorLogGroup:
      Type: AWS::Logs::LogGroup
      DeletionPolicy: ${file(config.yml):LOG_GROUP_DELETION_POLICE}
    ServeSignedDocLogGroup:
      Type: AWS::Logs::LogGroup
      DeletionPolicy: ${file(config.yml):LOG_GROUP_DELETION_POLICE}
    ServeUnsignedDocLogGroup:
      Type: AWS::Logs::LogGroup
      DeletionPolicy: ${file(config.yml):LOG_GROUP_DELETION_POLICE}
    CheckSignStatusLogGroup:
      Type: AWS::Logs::LogGroup
      DeletionPolicy: ${file(config.yml):LOG_GROUP_DELETION_POLICE}
    RegisterReadySignLogGroup:
      Type: AWS::Logs::LogGroup
      DeletionPolicy: ${file(config.yml):LOG_GROUP_DELETION_POLICE}
    CronRetryLogGroup:
      Type: AWS::Logs::LogGroup
      DeletionPolicy: ${file(config.yml):LOG_GROUP_DELETION_POLICE}

  ## In order to print out the hosted domain via `serverless info` we need to define the DomainName output for CloudFormation
  Outputs:
    WebAppCloudFrontDistributionOutput:
      Value:
        "Fn::GetAtt": [SignatureStatusWebAppCloudFrontDistribution, DomainName]
